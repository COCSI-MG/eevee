apiVersion: v1
kind: Service
metadata:
  name: source-storage
spec:
  selector:
    app.kubernetes.io/name: source-storage
  ports:
    - port: 3020
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: source-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: source-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: source-storage
          image: docker.io/library/node:22-alpine
          command: [node, /app/server.js]
          ports:
            - name: http
              containerPort: 3020
          env:
            - name: STORAGE_HOST
              value: '0.0.0.0'
            - name: STORAGE_ROOT
              value: /data/source
            - name: EEVEE_STORAGE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: source-storage
                  key: EEVEE_STORAGE_SIGNING_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: source-storage
        - name: data
          persistentVolumeClaim:
            claimName: eevee-student-source

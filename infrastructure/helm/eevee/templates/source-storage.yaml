apiVersion: v1
kind: Service
metadata:
  name: source-storage
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  selector:
    app: source-storage
  ports:
    - name: http
      port: 3020
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-storage
  labels:
    app: source-storage
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: source-storage
  template:
    metadata:
      labels:
        app: source-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: source-storage
          image: "{{ .Values.sourceStorage.image.repository }}:{{ .Values.sourceStorage.image.tag }}"
          imagePullPolicy: {{ .Values.sourceStorage.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3020
          env:
            - name: STORAGE_ROOT
              value: "/var/lib/eevee/source"
            - name: STORAGE_PORT
              value: "3020"
            - name: STORAGE_HOST
              value: "0.0.0.0"
            - name: STORAGE_MAX_FILE_BYTES
              value: {{ .Values.sourceStorage.limits.maxFileBytes | quote }}
            - name: STORAGE_MAX_PROJECT_BYTES
              value: {{ .Values.sourceStorage.limits.maxProjectBytes | quote }}
            - name: STORAGE_WORKSPACE_BODY_BYTES
              value: {{ .Values.sourceStorage.httpLimits.workspaceBodyBytes | quote }}
            - name: STORAGE_SNAPSHOT_BODY_BYTES
              value: {{ .Values.sourceStorage.httpLimits.snapshotBodyBytes | quote }}
            - name: STORAGE_ALLOWED_ORIGINS
              value: {{ printf "%s,%s" .Values.config.FRONT_URL .Values.config.CORS_ALLOWED_ORIGINS | quote }}
            - name: EEVEE_STORAGE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.secrets.name .Values.sourceStorage.secretName }}
                  key: {{ .Values.sourceStorage.secretKey }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sourceStorage.resources | nindent 12 }}
          volumeMounts:
            - name: student-source
              mountPath: /var/lib/eevee
      volumes:
        - name: student-source
          persistentVolumeClaim:
            claimName: {{ default .Values.sourceStorage.pvcName .Values.sourceStorage.existingClaim | quote }}
      {{- include "eevee.imagePullSecrets" . | nindent 6 }}
      {{- include "eevee.nodeSelector" . | nindent 6 }}

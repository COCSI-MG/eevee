{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eevee-ingress
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.certManager.issuer.enabled }}
    cert-manager.io/issuer: {{ .Values.certManager.issuer.name | quote }}
    {{- end }}
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      hosts:
        - {{ .Values.ingress.hosts.api }}
        - {{ .Values.ingress.hosts.front }}
        {{- if .Values.ingress.hosts.frontWww }}
        - {{ .Values.ingress.hosts.frontWww }}
        {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.api | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scheduler-api-service
                port:
                  number: {{ .Values.schedulerApi.containerPort }}
    - host: {{ .Values.ingress.hosts.front | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eevee-front-service
                port:
                  number: 80
    {{- if .Values.ingress.hosts.frontWww }}
    - host: {{ .Values.ingress.hosts.frontWww | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eevee-front-service
                port:
                  number: 80
    {{- end }}
{{- end }}

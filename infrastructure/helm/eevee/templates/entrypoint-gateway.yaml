{{- if .Values.entrypointGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: eevee-entrypoint-nginx
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
data:
  default.conf: |
{{- include "eevee.entrypointNginxConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eevee-entrypoint-gateway
  labels:
    app: eevee-entrypoint-gateway
    tier: gateway
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.entrypointGateway.replicas }}
  selector:
    matchLabels:
      app: eevee-entrypoint-gateway
  template:
    metadata:
      labels:
        app: eevee-entrypoint-gateway
      annotations:
        # Forces a rollout whenever the nginx ConfigMap content changes, since
        # nginx does not hot-reload its mounted config file on its own.
        checksum/config: {{ include "eevee.entrypointNginxConf" . | sha256sum }}
    spec:
      containers:
        - name: eevee-entrypoint-gateway
          image: {{ .Values.entrypointGateway.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The runtime resolver queries the full Service name.
              storage_host=$(awk -v prefix='{{ .Release.Namespace }}.svc.' '
                $1 == "search" {
                  for (i = 2; i <= NF; i++) {
                    if (index($i, prefix) == 1) {
                      print "source-storage." $i
                      exit
                    }
                  }
                }
              ' /etc/resolv.conf)
              export NGINX_STORAGE_HOST="${storage_host:-source-storage}"
              exec /docker-entrypoint.sh nginx -g 'daemon off;'
          env:
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: NGINX_ENVSUBST_FILTER
              value: "^(NGINX_LOCAL_RESOLVERS|NGINX_STORAGE_HOST)$"
          ports:
            - containerPort: {{ .Values.entrypointGateway.containerPort }}
          resources:
            {{- toYaml .Values.entrypointGateway.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /api/v1/
              port: {{ .Values.entrypointGateway.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: eevee-entrypoint-nginx
      {{- include "eevee.nodeSelector" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: eevee-entrypoint-service
  labels:
    app: eevee-entrypoint-gateway
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: eevee-entrypoint-gateway
  ports:
    - name: http
      port: {{ .Values.entrypointGateway.servicePort }}
      targetPort: {{ .Values.entrypointGateway.containerPort }}
      nodePort: {{ .Values.entrypointGateway.nodePort }}
{{- end }}

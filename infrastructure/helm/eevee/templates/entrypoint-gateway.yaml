{{- if .Values.entrypointGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: eevee-entrypoint-nginx
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.entrypointGateway.containerPort }};
      server_name _;

      location /api/v1/ {
        proxy_pass http://platform-api-service:{{ .Values.platformApi.containerPort }}/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }

      location / {
        proxy_pass http://eevee-front-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eevee-entrypoint-gateway
  labels:
    app: eevee-entrypoint-gateway
    tier: gateway
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.entrypointGateway.replicas }}
  selector:
    matchLabels:
      app: eevee-entrypoint-gateway
  template:
    metadata:
      labels:
        app: eevee-entrypoint-gateway
    spec:
      containers:
        - name: eevee-entrypoint-gateway
          image: {{ .Values.entrypointGateway.image | quote }}
          ports:
            - containerPort: {{ .Values.entrypointGateway.containerPort }}
          resources:
            {{- toYaml .Values.entrypointGateway.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: eevee-entrypoint-nginx
      {{- include "eevee.nodeSelector" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: eevee-entrypoint-service
  labels:
    app: eevee-entrypoint-gateway
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: eevee-entrypoint-gateway
  ports:
    - name: http
      port: {{ .Values.entrypointGateway.servicePort }}
      targetPort: {{ .Values.entrypointGateway.containerPort }}
      nodePort: {{ .Values.entrypointGateway.nodePort }}
{{- end }}

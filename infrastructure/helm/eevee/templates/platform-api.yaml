{{- if .Values.platformApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: platform-api-service
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: platform-api
  ports:
    - name: api
      port: {{ .Values.platformApi.containerPort }}
      targetPort: {{ .Values.platformApi.containerPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-deployment
  labels:
    app: platform-api
    tier: backend
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platformApi.replicas }}
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
        - name: platform-api
          image: "{{ .Values.platformApi.image.repository }}:{{ .Values.platformApi.image.tag }}"
          imagePullPolicy: {{ .Values.platformApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.platformApi.containerPort }}
            {{- if .Values.platformApi.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.platformApi.metrics.port }}
            {{- end }}
          env:
            - name: EEVEE_STORAGE_URL
              value: "http://source-storage:3020"
            - name: EEVEE_STORAGE_PUBLIC_URL
              value: "/storage"
            - name: EEVEE_STORAGE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.secrets.name .Values.sourceStorage.secretName }}
                  key: {{ .Values.sourceStorage.secretKey }}
            {{- if .Values.platformApi.metrics.enabled }}
            - name: EEVEE_METRICS_PORT
              value: {{ .Values.platformApi.metrics.port | quote }}
            - name: EEVEE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformApi.metrics.secretName }}
                  key: {{ .Values.platformApi.metrics.secretKey }}
            {{- end }}
            - name: ENV
              value: {{ .Values.platformApi.env | quote }}
            {{- with .Values.platformApi.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- include "eevee.appEnv" . | nindent 12 }}
            - name: PORT
              value: {{ .Values.platformApi.containerPort | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.platformApi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/
              port: {{ .Values.platformApi.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
      {{- include "eevee.imagePullSecrets" . | nindent 6 }}
      {{- include "eevee.nodeSelector" . | nindent 6 }}
{{- end }}

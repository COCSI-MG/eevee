{{- if .Values.queueWorker.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager-role
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-job-manager-binding
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: worker-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: job-manager-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{- if .Values.queueWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker-deployment
  labels:
    app: queue-worker
    tier: backend
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.queueWorker.replicas }}
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: queue-worker
          image: "{{ .Values.queueWorker.image.repository }}:{{ .Values.queueWorker.image.tag }}"
          imagePullPolicy: {{ .Values.queueWorker.image.pullPolicy }}
          args: {{ toJson .Values.queueWorker.args }}
          env:
            - name: ENV
              value: {{ .Values.queueWorker.env | quote }}
            {{- include "eevee.appEnv" . | nindent 12 }}
            {{- include "eevee.workerImageEnv" . | nindent 12 }}
            {{- include "eevee.jobRuntimeEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.queueWorker.resources | nindent 12 }}
      {{- include "eevee.imagePullSecrets" . | nindent 6 }}
      {{- include "eevee.nodeSelector" . | nindent 6 }}
{{- end }}

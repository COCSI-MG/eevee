server {
    listen 80;
    server_name 136.248.94.172;

    # Frontend ingress tunnel endpoint on the VM.
    location / {
        proxy_pass http://127.0.0.1:43080;
        proxy_http_version 1.1;
        proxy_set_header Host frontend.eeveecodelab.local;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scheduler API ingress tunnel endpoint on the VM.
    location /v1/ {
        proxy_pass http://127.0.0.1:43080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.eeveecodelab.local;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

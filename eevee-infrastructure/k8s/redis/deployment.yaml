apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis-deployment
  name: redis-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy: {}
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - image: redis:8.6.2
        name: redis
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "256Mi"
          requests:
            memory: "64Mi"
status: {}

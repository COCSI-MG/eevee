apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: guicargibar99@gmail.com 
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
    - dns01:
        cloudflare:
          email: guicargibar99@gmail.com 
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cefet-codelab-db.fullname" . }}
  labels:
    app: {{ include "cefet-codelab-db.name" . }}
    chart: {{ include "cefet-codelab-db.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: {{ include "cefet-codelab-db.name" . }}
    release: {{ .Release.Name }}
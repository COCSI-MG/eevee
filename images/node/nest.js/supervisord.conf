[supervisord]
nodaemon=true

[program:postgres]
; Run PostgreSQL as the postgres user, specifying the data directory
command=postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nest]
; Start the Nest.js application
command=node /app/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

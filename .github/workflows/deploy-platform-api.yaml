name: Deploy Platform API

on:
  push:
    branches:
      - main
    paths:
      - "platform-api/**"
      - "packages/execution-contracts/**"
      - "scripts/deploy-release.sh"
      - "scripts/test-deploy-release.sh"
      - ".github/workflows/validate-deployment.yaml"
      - ".github/actions/remote-kubectl/**"
      - ".github/workflows/deploy-platform-api.yaml"

env:
  REGISTRY: ghcr.io
  PLATFORM_API_IMAGE: "${{ vars.PLATFORM_API_IMAGE || 'cocsi-mg/eevee-platform-api' }}"

jobs:
  validate:
    uses: ./.github/workflows/validate-deployment.yaml
    secrets: inherit

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: eevee-production-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Check deployment value precedence
        run: bash scripts/test-deploy-release.sh

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PLATFORM_API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.PLATFORM_API_IMAGE }}:${{ github.sha }}

      - name: Atualiza Platform API e seus workers
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            set -euo pipefail
            DEPLOY_WORKDIR='${{ vars.DEPLOY_WORKDIR }}'
            : "${DEPLOY_WORKDIR:?Set the repository variable DEPLOY_WORKDIR (not a secret)}"
            cd "$DEPLOY_WORKDIR"
            git rev-parse --show-toplevel
            git fetch origin '${{ github.sha }}'
            CHART_WORKDIR=$(mktemp -d)
            trap 'rm -rf "$CHART_WORKDIR"' EXIT
            git archive '${{ github.sha }}' infrastructure/helm/eevee scripts/deploy-release.sh | tar -x -C "$CHART_WORKDIR"
            export CHART="$CHART_WORKDIR/infrastructure/helm/eevee"
            bash "$CHART_WORKDIR/scripts/deploy-release.sh" \
              --set-string platformApi.image.repository="${{ env.REGISTRY }}/${{ env.PLATFORM_API_IMAGE }}" \
              --set-string platformApi.image.tag='${{ github.sha }}'
            if ! kubectl rollout status deployment/platform-api-deployment -n eevee-cefetrj --timeout=5m; then
              kubectl get pods -n eevee-cefetrj -o wide
              kubectl describe deployment/platform-api-deployment -n eevee-cefetrj
              kubectl get events -n eevee-cefetrj --sort-by='.lastTimestamp'
              exit 1
            fi

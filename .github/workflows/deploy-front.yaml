name: Deploy Front

on:
  push:
    branches:
      - main
    paths:
      - "front/**"
      - "images/node/**"
      - "images/javascript-default/**"
      - ".github/actions/remote-kubectl/**"
      - ".github/workflows/deploy-front.yaml"

env:
  REGISTRY: ghcr.io
  FRONT_IMAGE: "${{ vars.FRONT_IMAGE || 'cocsi-mg/eevee-front' }}"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: eevee-production-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}:${{ github.sha }}

      - name: Atualiza o frontend
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_WORKDIR }}"
            git fetch origin '${{ github.sha }}'
            CHART_WORKDIR=$(mktemp -d)
            trap 'rm -rf "$CHART_WORKDIR"' EXIT
            git archive '${{ github.sha }}' infrastructure/helm/eevee | tar -x -C "$CHART_WORKDIR"
            CHART="$CHART_WORKDIR/infrastructure/helm/eevee"
            helm dependency build "$CHART"
            helm upgrade eevee "$CHART" --namespace eevee-cefetrj --reuse-values \
              --set front.image.repository="${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}" \
              --set-string front.image.tag='${{ github.sha }}' \
              --wait --timeout 10m
            if ! kubectl rollout status deployment/eevee-front-deployment -n eevee-cefetrj --timeout=5m; then
              kubectl get pods -n eevee-cefetrj -o wide
              kubectl describe deployment/eevee-front-deployment -n eevee-cefetrj
              kubectl get events -n eevee-cefetrj --sort-by='.lastTimestamp'
              exit 1
            fi

name: Deploy Front

on:
    push:
        branches:
        - main
        paths:
        - 'front/**'
        - '.github/workflows/deploy-front.yaml'

env:
    REGISTRY: ghcr.io
    FRONT_IMAGE: ${{ vars.FRONT_IMAGE }}


jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v3
            
            - name: Login no GitHub Container Registry
              uses: docker/login-action@v2
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GHCR_TOKEN }}
            
            - name: Build e Push da Imagem Docker
              uses: docker/build-push-action@v3
              with:
                context: ./front
                push: true
                build-args: |
                    NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
                    APP_ENV=${{ vars.APP_ENV }}
                tags: |
                    ${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}:latest
                    ${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}:${{ github.sha }}

            - name: Configurar kubectl
              uses: azure/setup-kubectl@v3

            - name: Atualiza Configuração do Kubernetes
              env:
                KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
              run: |
                mkdir -p $HOME/.kube
                echo "${KUBE_CONFIG_DATA}" | base64 --decode > $HOME/.kube/config
                chmod 600 $HOME/.kube/config

            - name: Atualiza imagem e reinicia o pod 
              run: |
                kubectl set image deployment/eevee-front-deployment eevee-front=${{ env.REGISTRY }}/${{ env.FRONT_IMAGE }}:${{ github.sha }} -n default

                kubectl rollout restart deployment/eevee-front-deployment -n default
              

name: Deploy Scheduler API

on:
    push:
        branches:
        - main
        paths:
        - 'scheduler-api/**'
        - '.github/workflows/deploy-scheduler-api.yaml'

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: guilhermepereira25/scheduler-api # está hardcoded aqui, mas pode ser parametrizado depois, e alterar a org/user se necessário

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v3
            
            - name: Login no GitHub Container Registry
              uses: docker/login-action@v2
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GHRC_TOKEN }}
            
            - name: Build e Push da Imagem Docker
              uses: docker/build-push-action@v3
              with:
                context: ./scheduler-api
                push: true
                tags: |
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Configurar kubectl
              uses: azure/setup-kubectl@v3

            - name: Atualiza Configuração do Kubernetes
              env:
                KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
              run: |
                mkdir -p $HOME/.kube
                echo "${KUBE_CONFIG_DATA}" | base64 --decode > $HOME/.kube/config
                chmod 600 $HOME/.kube/config

            - name: Atualiza imagem e reinicia o pod
              run: |
                kubectl set image deployment/scheduler-api-deployment scheduler-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n default

                kubectl rollout restart deployment/scheduler-api-deployment -n default

                kubectl rollout restart deployment queue-worker-deployment -n default
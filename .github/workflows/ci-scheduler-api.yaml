name: CI Platform API

on:
    pull_request:
        branches:
            - develop
            - main
        paths:
            - "platform-api/**"
            - "packages/execution-contracts/**"
            - ".github/workflows/ci-scheduler-api.yaml"

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
              working-directory: platform-api
        steps:
            - uses: actions/checkout@v4
            - name: Node.js Setup
              uses: actions/setup-node@v4
              with:
                node-version: "22"
                cache: "npm"
                cache-dependency-path: platform-api/package-lock.json
            - run: npm ci
            - name: Tests
              run: npm test
            - name: Build
              run: npm run build

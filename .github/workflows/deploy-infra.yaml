name: Deploy Infrastructure

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: default

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply application secrets
        run: |
          kubectl -n "$NAMESPACE" create secret generic eevee-secrets \
            --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-auth \
            --docker-server="$REGISTRY" \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GHCR_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy EEVEE Helm release
        run: |
          helm dependency build infrastructure/helm/eevee
          helm upgrade --install eevee infrastructure/helm/eevee \
            --namespace "$NAMESPACE" \
            --set platformApi.image.repository="$REGISTRY/${{ vars.PLATFORM_API_IMAGE }}" \
            --set platformApi.image.tag=latest \
            --set assignmentRunner.image.repository="$REGISTRY/${{ vars.ASSIGNMENT_RUNNER_IMAGE }}" \
            --set assignmentRunner.image.tag=latest \
            --set front.image.repository="$REGISTRY/${{ vars.FRONT_IMAGE }}" \
            --set front.image.tag=latest \
            --wait --timeout 10m

      - name: Check rollout status
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-deployment --timeout=120s
          kubectl -n "$NAMESPACE" rollout status deployment/assignment-runner-deployment --timeout=120s

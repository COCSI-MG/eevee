name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/helm/eevee/**"
      - "scripts/deploy-release.sh"
      - ".github/workflows/deploy-infra.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: eevee-cefetrj
  PLATFORM_API_IMAGE: "${{ vars.PLATFORM_API_IMAGE || 'cocsi-mg/eevee-platform-api' }}"
  ASSIGNMENT_RUNNER_IMAGE: "${{ vars.ASSIGNMENT_RUNNER_IMAGE || 'cocsi-mg/eevee-assignment-runner' }}"
  FRONT_IMAGE: "${{ vars.FRONT_IMAGE || 'cocsi-mg/eevee-front' }}"

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    concurrency:
      group: eevee-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment value precedence
        run: bash scripts/test-deploy-release.sh

      - name: Deploy infrastructure from the VM
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            set -euo pipefail
            REGISTRY=ghcr.io
            NAMESPACE=eevee-cefetrj
            cd "${{ vars.DEPLOY_WORKDIR }}"
            git fetch origin '${{ github.sha }}'
            CHART_WORKDIR=$(mktemp -d)
            trap 'rm -rf "$CHART_WORKDIR"' EXIT
            git archive '${{ github.sha }}' infrastructure/helm/eevee scripts/deploy-release.sh | tar -x -C "$CHART_WORKDIR"
            export CHART="$CHART_WORKDIR/infrastructure/helm/eevee"
            # Secrets are provisioned out-of-band; configuration deploys do not rotate them.
            bash "$CHART_WORKDIR/scripts/deploy-release.sh"

            for deployment in platform-api-deployment assignment-runner-deployment eevee-front-deployment; do
              if ! kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=5m; then
                kubectl get pods -n "$NAMESPACE" -o wide
                kubectl describe "deployment/$deployment" -n "$NAMESPACE"
                kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp'
                exit 1
              fi
            done

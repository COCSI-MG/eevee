name: Deploy Assignment Runner

on:
  push:
    branches:
      - main
    paths:
      - "assignment-runner/**"
      - "packages/execution-contracts/**"
      - ".github/actions/remote-kubectl/**"
      - ".github/workflows/deploy-assignment-runner.yaml"

env:
  REGISTRY: ghcr.io
  ASSIGNMENT_RUNNER_IMAGE: "${{ vars.ASSIGNMENT_RUNNER_IMAGE || 'cocsi-mg/eevee-assignment-runner' }}"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./assignment-runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }}

      - name: Atualiza imagem do Assignment Runner
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            kubectl set image deployment/assignment-runner-deployment assignment-runner=${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }} -n eevee-cefetrj
            if ! kubectl rollout status deployment/assignment-runner-deployment -n eevee-cefetrj --timeout=5m; then
              kubectl get pods -n eevee-cefetrj -o wide
              kubectl describe deployment/assignment-runner-deployment -n eevee-cefetrj
              kubectl get events -n eevee-cefetrj --sort-by='.lastTimestamp'
              exit 1
            fi

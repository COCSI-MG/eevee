name: Deploy Assignment Runner

on:
  push:
    branches:
      - main
    paths:
      - "assignment-runner/**"
      - "images/node/postgresql/**"
      - "images/node/node-default/**"
      - "images/node/nest.js/**"
      - ".github/workflows/postgresql-workers.yaml"
      - "packages/execution-contracts/**"
      - "scripts/deploy-release.sh"
      - "scripts/test-deploy-release.sh"
      - ".github/workflows/validate-deployment.yaml"
      - ".github/actions/remote-kubectl/**"
      - ".github/workflows/deploy-assignment-runner.yaml"

env:
  REGISTRY: ghcr.io
  ASSIGNMENT_RUNNER_IMAGE: "${{ vars.ASSIGNMENT_RUNNER_IMAGE || 'cocsi-mg/eevee-assignment-runner' }}"

jobs:
  validate:
    uses: ./.github/workflows/validate-deployment.yaml
    secrets: inherit

  postgresql-workers:
    needs: validate
    uses: ./.github/workflows/postgresql-workers.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  build-and-deploy:
    needs: [validate, postgresql-workers]
    runs-on: ubuntu-latest
    concurrency:
      group: eevee-production-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Check deployment value precedence
        run: bash scripts/test-deploy-release.sh

      - name: Set worker registry namespace
        id: worker-registry
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./assignment-runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }}

      - name: Atualiza imagem do Assignment Runner
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            set -euo pipefail
            DEPLOY_WORKDIR='${{ vars.DEPLOY_WORKDIR }}'
            : "${DEPLOY_WORKDIR:?Set the repository variable DEPLOY_WORKDIR (not a secret)}"
            cd "$DEPLOY_WORKDIR"
            git rev-parse --show-toplevel
            git fetch origin '${{ github.sha }}'
            CHART_WORKDIR=$(mktemp -d)
            trap 'rm -rf "$CHART_WORKDIR"' EXIT
            git archive '${{ github.sha }}' infrastructure/helm/eevee scripts/deploy-release.sh | tar -x -C "$CHART_WORKDIR"
            export CHART="$CHART_WORKDIR/infrastructure/helm/eevee"
            bash "$CHART_WORKDIR/scripts/deploy-release.sh" \
              --set-string assignmentRunner.image.repository="${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}" \
              --set-string assignmentRunner.image.tag='${{ github.sha }}' \
              --set-string workerImages.nodeDefaultPostgresql="${{ steps.worker-registry.outputs.namespace }}/worker-node-default-postgresql-img:latest" \
              --set-string workerImages.nodeNestjsPostgresql="${{ steps.worker-registry.outputs.namespace }}/worker-nestjs-postgresql-img:latest"
            if ! kubectl rollout status deployment/assignment-runner-deployment -n eevee-cefetrj --timeout=5m; then
              kubectl get pods -n eevee-cefetrj -o wide
              kubectl describe deployment/assignment-runner-deployment -n eevee-cefetrj
              kubectl get events -n eevee-cefetrj --sort-by='.lastTimestamp'
              exit 1
            fi

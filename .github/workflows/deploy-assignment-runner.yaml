name: Deploy Assignment Runner

on:
    push:
        branches:
        - main
        paths:
        - 'assignment-runner/**'
        - 'packages/execution-contracts/**'
        - '.github/actions/remote-kubectl/**'
        - '.github/workflows/deploy-assignment-runner.yaml'

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    ASSIGNMENT_RUNNER_IMAGE: "${{ vars.ASSIGNMENT_RUNNER_IMAGE || 'cocsi-mg/assignment-runner' }}"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do codigo
              uses: actions/checkout@v4

            - name: Login no GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build e Push da Imagem Docker
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./assignment-runner/Dockerfile
                push: true
                tags: |
                    ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:latest
                    ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }}

            - name: Atualiza imagem do Assignment Runner
              uses: ./.github/actions/remote-kubectl
              with:
                host: ${{ vars.DEPLOY_HOST }}
                username: ${{ vars.DEPLOY_USER }}
                port: "${{ vars.DEPLOY_SSH_PORT || '22' }}"
                private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
                known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
                script: |
                  kubectl set image deployment/assignment-runner-deployment assignment-runner=${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }} -n default
                  kubectl rollout status deployment/assignment-runner-deployment -n default --timeout=120s
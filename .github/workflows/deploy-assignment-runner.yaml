name: Deploy Assignment Runner

on:
  push:
    branches:
      - main
    paths:
      - "assignment-runner/**"
      - "images/node/postgresql/**"
      - "images/node/node-default/**"
      - "images/node/nest.js/**"
      - ".github/workflows/postgresql-workers.yaml"
      - "packages/execution-contracts/**"
      - ".github/actions/remote-kubectl/**"
      - ".github/workflows/deploy-assignment-runner.yaml"

env:
  REGISTRY: ghcr.io
  ASSIGNMENT_RUNNER_IMAGE: "${{ vars.ASSIGNMENT_RUNNER_IMAGE || 'cocsi-mg/eevee-assignment-runner' }}"

jobs:
  postgresql-workers:
    uses: ./.github/workflows/postgresql-workers.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  build-and-deploy:
    needs: postgresql-workers
    runs-on: ubuntu-latest
    concurrency:
      group: eevee-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./assignment-runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}:${{ github.sha }}

      - name: Atualiza imagem do Assignment Runner
        uses: ./.github/actions/remote-kubectl
        with:
          host: "${{ vars.INPUT_HOST }}"
          username: "${{ vars.INPUT_USER }}"
          port: "${{ vars.INPUT_PORT || '22' }}"
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          private-key-passphrase: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PASSPHRASE }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          script: |
            RUNNER_SERVICE_ACCOUNT=$(kubectl get deployment assignment-runner-deployment -n eevee-cefetrj -o jsonpath='{.spec.template.spec.serviceAccountName}')
            kubectl apply -n eevee-cefetrj -f - <<YAML
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: postgresql-worker-lifecycle
            rules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["create", "get", "delete"]
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list", "delete"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: postgresql-worker-lifecycle
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: postgresql-worker-lifecycle
            subjects:
              - kind: ServiceAccount
                name: ${RUNNER_SERVICE_ACCOUNT:-default}
                namespace: eevee-cefetrj
            YAML
            set -euo pipefail
            cd "${{ vars.DEPLOY_WORKDIR }}"
            git fetch origin '${{ github.sha }}'
            CHART_WORKDIR=$(mktemp -d)
            trap 'rm -rf "$CHART_WORKDIR"' EXIT
            git archive '${{ github.sha }}' infrastructure/helm/eevee | tar -x -C "$CHART_WORKDIR"
            CHART="$CHART_WORKDIR/infrastructure/helm/eevee"
            helm dependency build "$CHART"
            helm upgrade eevee "$CHART" --namespace eevee-cefetrj --reuse-values \
              --set assignmentRunner.image.repository="${{ env.REGISTRY }}/${{ env.ASSIGNMENT_RUNNER_IMAGE }}" \
              --set-string assignmentRunner.image.tag='${{ github.sha }}' \
              --set-string workerImages.nodeDefaultPostgresql="ghcr.io/${{ github.repository_owner }}/worker-node-default-postgresql-img:${{ github.sha }}" \
              --set-string workerImages.nodeNestjsPostgresql="ghcr.io/${{ github.repository_owner }}/worker-nestjs-postgresql-img:${{ github.sha }}" \
              --wait --timeout 10m
            if ! kubectl rollout status deployment/assignment-runner-deployment -n eevee-cefetrj --timeout=5m; then
              kubectl get pods -n eevee-cefetrj -o wide
              kubectl describe deployment/assignment-runner-deployment -n eevee-cefetrj
              kubectl get events -n eevee-cefetrj --sort-by='.lastTimestamp'
              exit 1
            fi
